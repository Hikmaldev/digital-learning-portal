<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ruang Belajar — Portal Belajar Digital">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33504a"/>
      <stop offset="1" stop-color="#182622"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1ecdb"/>
    </linearGradient>
  </defs>

  <!-- latar -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>

  <!-- halaman kiri buku -->
  <path d="M9.5 30 C17 23 26 22 31.5 26.5 L31.5 47.5 C24 44 16 45 9.5 47.5 Z" fill="url(#page)"/>
  <!-- halaman kanan buku -->
  <path d="M54.5 30 C47 23 38 22 32.5 26.5 L32.5 47.5 C40 44 48 45 54.5 47.5 Z" fill="url(#page)"/>

  <!-- garis teks halaman kiri -->
  <g stroke="#cdc9b7" stroke-width="1.9" stroke-linecap="round">
    <path d="M14 34 L27.5 34"/>
    <path d="M14 38.6 L26 38.6"/>
    <path d="M14 43.2 L23 43.2"/>
  </g>
  <!-- garis teks halaman kanan -->
  <g stroke="#cdc9b7" stroke-width="1.9" stroke-linecap="round">
    <path d="M36.5 34 L50 34"/>
    <path d="M38 38.6 L50 38.6"/>
    <path d="M41 43.2 L50 43.2"/>
  </g>

  <!-- pembatas halaman (tulang buku / pita baca) -->
  <path d="M30.4 26.5 L33.6 26.5 L33.6 45 L32 48 L30.4 45 Z" fill="#e7755d"/>

  <!-- bintang / percikan -->
  <path d="M46 10.6 L48.4 17 L54.8 19.4 L48.4 21.8 L46 28.2 L43.6 21.8 L37.2 19.4 L43.6 17 Z" fill="#f2c858"/>
</svg>